<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#15366e">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/site.webmanifest">
  <title>Descubra sua rota no Guia 189 Formulações</title>
  <meta name="description" content="Responda a algumas perguntas e descubra quais categorias do Guia 189 Formulações combinam mais com o seu objetivo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#16366e;--navy2:#0d2858;--teal:#25ae9f;--teal2:#13887d;--mint:#e9f8f5;--paper:#f4f6f8;--sand:#f7f2e7;--ink:#26385f;--muted:#6b758a;--line:#dce3e8;--white:#fff;--danger:#c72f35;--shadow:0 24px 70px rgba(19,48,99,.14)}
    *{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%}body{font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#fff 0,#f3f6f8 50%,#e8eef2 100%);color:var(--ink);line-height:1.55}.shell{min-height:100vh;display:flex;flex-direction:column}.topline{height:8px;background:linear-gradient(90deg,var(--navy),var(--teal))}.quiz-head{width:min(860px,calc(100% - 32px));margin:20px auto 0;display:flex;align-items:center;gap:14px}.back{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--navy);font-size:1.2rem;cursor:pointer;visibility:hidden}.back.show{visibility:visible}.progress-wrap{flex:1}.progress-label{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:7px}.progress{height:8px;background:#dfe5e9;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--navy),var(--teal));border-radius:inherit;transition:width .4s ease}.main{flex:1;display:grid;place-items:start center;padding:24px 16px 60px}.card{width:min(780px,100%);background:rgba(255,255,255,.98);border:1px solid rgba(218,225,231,.95);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.screen{padding:38px 44px 42px;animation:in .32s ease}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.center{text-align:center}.eyebrow{display:inline-flex;align-items:center;gap:6px;background:var(--mint);color:var(--teal2);border-radius:99px;padding:7px 13px;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:15px}h1,h2,h3{font-family:Poppins,Inter,sans-serif;color:var(--navy2);line-height:1.12}h1{font-size:clamp(1.8rem,6vw,3rem);font-weight:900;letter-spacing:-.035em}h2{font-size:clamp(1.45rem,4vw,2.05rem);font-weight:850;letter-spacing:-.025em}h3{font-size:1rem}.accent{color:var(--teal)}.sub{color:var(--muted);max-width:620px;margin:13px auto 0}.hero{width:min(360px,78vw);margin:-8px auto -14px;filter:drop-shadow(0 18px 24px rgba(18,48,99,.13))}.trust{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:19px 0 23px}.trust span{font-size:.72rem;font-weight:700;color:#54707c;background:#f2f8f7;border:1px solid #dcebe8;border-radius:99px;padding:6px 10px}.primary{display:inline-flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:14px;padding:17px 22px;background:linear-gradient(135deg,var(--teal),#2bc3b0);color:#fff;font:800 .96rem Poppins;text-transform:uppercase;cursor:pointer;box-shadow:0 13px 26px rgba(37,174,159,.25);transition:.2s}.primary:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(37,174,159,.32)}.primary:disabled{opacity:.45;cursor:not-allowed;transform:none}.micro{font-size:.72rem;color:var(--muted);margin-top:12px}.question-top{text-align:center;margin-bottom:25px}.question-top .number{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 10px;border-radius:50%;background:var(--navy);color:#fff;font:800 .8rem Poppins}.question-top p{color:var(--muted);font-size:.88rem;margin-top:8px}.options{display:grid;gap:11px}.options.two{grid-template-columns:1fr 1fr}.option{width:100%;display:flex;align-items:center;gap:13px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;color:var(--ink);font:650 .92rem Inter;cursor:pointer;transition:.18s}.option:hover{border-color:#8ed5cc;background:#f8fdfc;transform:translateY(-1px)}.option.selected{border-color:var(--teal);background:var(--mint);box-shadow:0 0 0 3px rgba(37,174,159,.09)}.option .icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;background:#f0f4f7;border-radius:10px;font-size:1.18rem}.option.selected .icon{background:#fff}.option small{display:block;font-weight:500;color:var(--muted);margin-top:2px}.continue{margin-top:18px}.local-note{display:flex;align-items:flex-start;gap:8px;margin-top:14px;background:#f7f9fa;border-radius:10px;padding:10px 12px;font-size:.7rem;color:var(--muted)}.input-label{display:block;font-weight:750;margin-bottom:8px}.text-input{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:16px;font:600 1rem Inter;color:var(--ink);outline:none}.text-input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(37,174,159,.1)}.bridge{background:linear-gradient(150deg,#e9f8f5,#fff);border:1px solid #d5ece8;border-radius:16px;padding:20px;margin:22px 0;text-align:left}.bridge strong{color:var(--navy)}.loading-icon{width:98px;height:98px;margin:12px auto 22px;border-radius:50%;position:relative;display:grid;place-items:center;background:var(--mint);font-size:2.2rem}.loading-icon:before{content:'';position:absolute;inset:-7px;border:7px solid #dcece9;border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.load-bar{height:12px;background:#e5eaed;border-radius:99px;overflow:hidden;margin:23px 0 8px}.load-bar span{display:block;width:8%;height:100%;background:linear-gradient(90deg,var(--navy),var(--teal));border-radius:inherit;transition:width .5s ease}.checks{display:grid;gap:8px;margin:18px auto 0;max-width:390px;text-align:left}.check{font-size:.84rem;color:var(--muted);opacity:.35;transition:.3s}.check.done{color:var(--teal2);opacity:1}.result-head{background:linear-gradient(145deg,var(--navy2),var(--navy));color:#fff;padding:34px 42px;text-align:center}.result-head h1,.result-head h2{color:#fff}.result-head .eyebrow{background:rgba(255,255,255,.13);color:#baf5ec}.result-body{padding:30px 42px 38px}.hello{font-size:1rem;text-align:center;margin-bottom:20px}.route{border:1px solid #d8e6e4;border-radius:17px;background:linear-gradient(145deg,#f1fbf9,#fff);padding:22px}.route-title{display:flex;gap:13px;align-items:center}.route-title .big-icon{width:50px;height:50px;border-radius:13px;background:#fff;display:grid;place-items:center;font-size:1.55rem;box-shadow:0 7px 18px rgba(18,67,89,.09)}.route p{font-size:.86rem;color:var(--muted);margin-top:12px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.tag{background:#fff;border:1px solid #cfe6e2;color:var(--teal2);font-size:.72rem;font-weight:750;padding:6px 9px;border-radius:99px}.diagnosis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.metric{background:#f5f7f9;border-radius:12px;padding:13px;text-align:center}.metric b{display:block;color:var(--navy);font:800 .87rem Poppins}.metric span{font-size:.67rem;color:var(--muted)}.included{list-style:none;margin:18px 0}.included li{position:relative;padding:8px 0 8px 26px;border-bottom:1px solid #eef1f3;font-size:.86rem}.included li:before{content:'✓';position:absolute;left:0;color:var(--teal);font-weight:900}.result-cta{background:var(--navy);border-radius:17px;color:#fff;padding:22px;text-align:center}.result-cta h3{color:#fff;font-size:1.1rem}.result-cta p{color:#d4e0ef;font-size:.82rem;margin:7px 0 15px}.result-cta .primary{text-decoration:none}.medical{font-size:.67rem;color:var(--muted);text-align:center;margin-top:14px}.footer{text-align:center;color:#8a93a3;font-size:.67rem;padding:0 16px 24px}
    @media(max-width:620px){.quiz-head{margin-top:14px}.main{padding:18px 10px 40px}.card{border-radius:20px}.screen{padding:28px 18px 30px}.intro{display:flex;flex-direction:column;align-items:center}.intro .eyebrow{order:1}.intro h1{order:2}.intro .sub{order:3}.intro .primary{order:4;margin-top:20px}.intro .micro{order:5}.intro .hero{order:6;width:min(260px,76vw);margin:5px auto -14px}.intro .trust{order:7;margin:10px 0 0}.options.two{grid-template-columns:1fr}.option{padding:13px}.result-head{padding:27px 18px}.result-body{padding:24px 17px 28px}.diagnosis{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}.trust{gap:6px}.trust span{font-size:.65rem}.progress-label{font-size:.65rem}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="topline"></div>
    <header class="quiz-head" id="quizHead" hidden>
      <button class="back" id="backBtn" type="button" aria-label="Voltar">←</button>
      <div class="progress-wrap"><div class="progress-label"><span>Seu diagnóstico</span><span id="progressText">1 de 8</span></div><div class="progress"><span id="progressBar"></span></div></div>
    </header>
    <main class="main"><div class="card" id="app" aria-live="polite"></div></main>
    <footer class="footer">Conteúdo educativo. Este diagnóstico não substitui avaliação de um profissional de saúde.</footer>
  </div>
  <script>
    const state={step:-1,answers:{},history:[],multi:[],name:''};
    const app=document.getElementById('app'),head=document.getElementById('quizHead'),back=document.getElementById('backBtn'),bar=document.getElementById('progressBar'),progressText=document.getElementById('progressText');
    const goalData={
      emagrecimento:{icon:'🔥',title:'Metabolismo e composição corporal',desc:'Sua rota prioriza referências ligadas a metabolismo, AMPK e estratégias de suporte corporal.',tags:['Perda de Peso & AMPK','Termogênicos & Jejum','Metabolismo'],ad:'Criativo Retatrutida'},
      foco:{icon:'🧠',title:'Foco, memória e desempenho mental',desc:'Sua rota prioriza categorias relacionadas a clareza mental, concentração e resposta ao estresse.',tags:['Nootrópicos & Foco','Biohacking Cognitivo','Adaptógenos'],ad:'Criativo Foco'},
      sono:{icon:'😴',title:'Sono, ansiedade e recuperação',desc:'Sua rota começa por referências ligadas à rotina noturna, relaxamento e recuperação.',tags:['Sono & Circadiano','Ansiedade & Humor','Adaptógenos'],ad:'Sono'},
      libido:{icon:'💙',title:'Libido, vitalidade e hormônios',desc:'Sua rota prioriza as categorias de vitalidade, libido e suporte hormonal educativo.',tags:['Libido & Testosterona','Performance Diária','Minerais'],ad:'Vitalidade'},
      articulacoes:{icon:'🦴',title:'Articulações, mobilidade e desconforto',desc:'Sua rota começa pelas referências voltadas a suporte articular, mobilidade e recuperação.',tags:['Saúde Articular','Mobilidade','Recuperação'],ad:'Articulações'},
      longevidade:{icon:'⏳',title:'Longevidade e energia celular',desc:'Sua rota prioriza as categorias relacionadas a energia celular, antioxidantes e performance diária.',tags:['Longevidade Celular','Performance Diária','Antioxidantes'],ad:'Longevidade'}
    };
    const struggles={
      emagrecimento:[['🍽️','Controlar a fome e a compulsão'],['📉','O peso não baixa como antes'],['💪','Emagrecer preservando massa muscular'],['🧩','Não sei qual estratégia faz sentido']],
      foco:[['🌀','Distração e dificuldade de começar'],['🥱','Cansaço mental ao estudar ou trabalhar'],['🧠','Memória fraca e informação que não fixa'],['😰','Ansiedade que atrapalha a concentração']],
      sono:[['🌙','Demoro muito para dormir'],['⏰','Acordo várias vezes durante a noite'],['🥱','Durmo, mas acordo cansado'],['💭','Mente acelerada e excesso de pensamentos']],
      libido:[['🔋','Energia e disposição muito baixas'],['💙','Libido abaixo do normal'],['📉','Performance caiu nos últimos meses'],['🧩','Não sei por onde começar']],
      articulacoes:[['🦵','Desconforto ao me movimentar'],['🏋️','Recuperação ruim após exercícios'],['🪑','Rigidez depois de muito tempo parado'],['🧩','Não sei quais ativos pesquisar']],
      longevidade:[['🔋','Energia diária oscilando muito'],['⏳','Quero cuidar melhor do envelhecimento'],['🧬','Quero entender ativos de longevidade'],['🧩','Informação demais e pouca clareza']]
    };
    const questions=[
      {key:'goal',title:'Qual é o seu principal objetivo hoje?',hint:'Essa resposta define a rota inicial do seu diagnóstico.',cols:true,options:[['🔥','Emagrecimento e metabolismo','emagrecimento'],['🧠','Foco, memória e concentração','foco'],['😴','Sono e controle do estresse','sono'],['💙','Libido e vitalidade','libido'],['🦴','Articulações e mobilidade','articulacoes'],['⏳','Longevidade e energia celular','longevidade']]},
      {key:'struggle',title:'Qual situação mais combina com o seu momento?',hint:'Escolha o ponto que mais incomoda hoje.',dynamic:true},
      {key:'experience',title:'Como você costuma pesquisar soluções para esse objetivo?',hint:'Não existe resposta certa ou errada.',options:[['🌱','Estou começando agora','iniciante'],['🔎','Pesquiso bastante, mas fico confuso','pesquisador'],['🧪','Já uso suplementos ou manipulados','usuario'],['📚','Tenho experiência e quero referências','experiente']]},
      {key:'blocker',title:'O que mais atrapalha você a avançar?',hint:'A resposta ajuda a definir o tipo de organização ideal.',options:[['🌐','Informações contraditórias na internet','contradicao'],['⚖️','Dificuldade para comparar dosagens','dosagens'],['💸','Já gastei com opções que não ajudaram','gastos'],['🗂️','Não encontro tudo organizado','organizacao']]},
      {key:'urgency',title:'Quando você gostaria de ter mais clareza sobre isso?',hint:'Seu nível de urgência ajuda a ordenar a recomendação.',options:[['⚡','Quero começar a pesquisar hoje','agora'],['📅','Nas próximas semanas','semanas'],['🧭','Estou apenas conhecendo possibilidades','explorando']]},
      {key:'impact',title:'O que mudaria se você encontrasse tudo organizado?',hint:'Você pode escolher mais de uma opção.',multi:true,options:[['⏱️','Economizaria tempo de pesquisa','tempo'],['🧠','Teria mais clareza para decidir','clareza'],['🤝','Conversaria melhor com um profissional','profissional'],['💰','Evitaria compras sem critério','economia']]},
      {key:'commitment',title:'Se você tivesse uma rota clara para o seu objetivo, isso ajudaria agora?',hint:'Falta pouco para liberar sua recomendação.',options:[['✅','Sim, quero ver minha rota','sim'],['🤔','Talvez, quero entender melhor','talvez']]}
    ];
    function safe(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function updateHead(){const total=questions.length+1;head.hidden=state.step<0||state.step>questions.length;const current=Math.min(state.step+1,total);bar.style.width=`${Math.max(8,current/total*100)}%`;progressText.textContent=`${current} de ${total}`;back.classList.toggle('show',state.step>0&&state.step<=questions.length)}
    function renderIntro(){head.hidden=true;app.innerHTML=`<section class="screen center intro"><span class="eyebrow">🧭 Diagnóstico gratuito • 2 minutos</span><h1>Descubra quais categorias das <span class="accent">189 formulações</span> combinam com seu objetivo</h1><img class="hero" src="/assets/images/hero.webp" alt="Guia 189 Formulações Magistrais" width="360" height="360"><p class="sub">Responda a perguntas rápidas e receba uma rota de leitura personalizada para navegar pelo guia sem perder tempo.</p><div class="trust"><span>✓ Sem cadastro obrigatório</span><span>✓ Resultado imediato</span><span>✓ 100% educativo</span></div><button class="primary" id="start">Começar meu diagnóstico →</button><p class="micro">🔒 Suas respostas ficam somente neste navegador.</p></section>`;document.getElementById('start').onclick=()=>go(0)}
    function getOptions(q){if(q.dynamic)return struggles[state.answers.goal]||struggles.foco;return q.options}
    function renderQuestion(){updateHead();const q=questions[state.step],opts=getOptions(q);state.multi=q.multi?(Array.isArray(state.answers[q.key])?[...state.answers[q.key]]:[]):[];app.innerHTML=`<section class="screen"><div class="question-top"><span class="number">${state.step+1}</span><h2>${q.title}</h2><p>${q.hint}</p></div><div class="options ${q.cols?'two':''}" id="options">${opts.map((o,i)=>`<button class="option ${q.multi&&state.multi.includes(o[2]||o[1])?'selected':''}" data-i="${i}" type="button"><span class="icon">${o[0]}</span><span>${o[1]}</span></button>`).join('')}</div>${q.multi?'<button class="primary continue" id="continue" disabled>Continuar →</button>':''}</section>`;
      document.querySelectorAll('.option').forEach(btn=>btn.onclick=()=>selectOption(q,opts[Number(btn.dataset.i)],btn));if(q.multi)syncMultiButton()}
    function selectOption(q,opt,btn){const value=opt[2]||opt[1];if(q.multi){btn.classList.toggle('selected');state.multi=state.multi.includes(value)?state.multi.filter(x=>x!==value):[...state.multi,value];syncMultiButton();return}state.answers[q.key]=value;setTimeout(()=>go(state.step+1),140)}
    function syncMultiButton(){const b=document.getElementById('continue');if(!b)return;b.disabled=!state.multi.length;b.onclick=()=>{state.answers[questions[state.step].key]=[...state.multi];go(state.step+1)}}
    function renderName(){updateHead();app.innerHTML=`<section class="screen"><div class="question-top"><span class="number">8</span><h2>Como podemos chamar você no resultado?</h2><p>Seu nome é opcional e será usado apenas nesta tela.</p></div><label class="input-label" for="name">Primeiro nome</label><input class="text-input" id="name" maxlength="30" autocomplete="off" placeholder="Ex.: Maria" value="${safe(state.name)}"><div class="local-note">🔒 Este campo não envia seus dados para nenhum servidor. A personalização acontece somente neste navegador.</div><button class="primary continue" id="analyze">Analisar minhas respostas →</button></section>`;const input=document.getElementById('name');document.getElementById('analyze').onclick=()=>{state.name=input.value.trim();renderLoading()};input.addEventListener('keydown',e=>{if(e.key==='Enter'){state.name=input.value.trim();renderLoading()}})}
    function renderLoading(){head.hidden=true;app.innerHTML=`<section class="screen center"><div class="loading-icon">🧬</div><h2>Cruzando suas respostas...</h2><p class="sub">Estamos organizando uma rota de leitura de acordo com seu objetivo, momento e urgência.</p><div class="load-bar"><span id="loader"></span></div><b id="pct" style="color:var(--teal)">8%</b><div class="checks"><div class="check" id="c1">✓ Objetivo principal identificado</div><div class="check" id="c2">✓ Nível de experiência analisado</div><div class="check" id="c3">✓ Categorias prioritárias organizadas</div></div></section>`;let p=8;const timer=setInterval(()=>{p=Math.min(100,p+Math.ceil(Math.random()*9));document.getElementById('loader').style.width=p+'%';document.getElementById('pct').textContent=p+'%';if(p>30)document.getElementById('c1').classList.add('done');if(p>60)document.getElementById('c2').classList.add('done');if(p>86)document.getElementById('c3').classList.add('done');if(p===100){clearInterval(timer);setTimeout(renderResult,550)}},150)}
    function renderResult(){const g=goalData[state.answers.goal]||goalData.foco;const exp={iniciante:'Começando agora',pesquisador:'Já pesquisa o tema',usuario:'Já utiliza referências',experiente:'Nível experiente'}[state.answers.experience]||'Perfil identificado';const urg={agora:'Prioridade alta',semanas:'Próximas semanas',explorando:'Fase de descoberta'}[state.answers.urgency]||'Ritmo definido';const first=state.name?safe(state.name)+', ':'';try{sessionStorage.setItem('quiz189',JSON.stringify(state.answers))}catch(e){}
      app.innerHTML=`<section><div class="result-head"><span class="eyebrow">✓ Diagnóstico concluído</span><h1>${first}sua rota está pronta</h1><p style="margin-top:10px;color:#d9e7f4">Com base nas suas respostas, encontramos o melhor ponto de partida dentro do guia.</p></div><div class="result-body"><div class="route"><div class="route-title"><span class="big-icon">${g.icon}</span><div><small style="color:var(--teal2);font-weight:800">SUA PRIORIDADE</small><h2 style="font-size:1.35rem">${g.title}</h2></div></div><p>${g.desc}</p><div class="tags">${g.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><div class="diagnosis"><div class="metric"><b>${exp}</b><span>Seu momento</span></div><div class="metric"><b>${urg}</b><span>Sua urgência</span></div><div class="metric"><b>Rota ${g.ad}</b><span>Ponto de entrada</span></div></div><div class="bridge"><strong>Boa notícia:</strong> o Guia 189 Formulações reúne as categorias da sua rota junto de outras áreas de saúde e performance, em um PDF pesquisável e organizado por objetivo.</div><ul class="included"><li>Comece pelas categorias destacadas acima</li><li>Compare composições e dosagens de referência</li><li>Use o índice para encontrar ativos rapidamente</li><li>Leve suas dúvidas a um profissional habilitado</li></ul><div class="result-cta"><h3>Seu próximo passo está pronto</h3><p>Veja o guia completo e tenha acesso às 189 formulações organizadas.</p><a class="primary" href="/">Ver meu guia completo →</a></div><p class="medical">Este resultado é educativo e não representa diagnóstico, indicação ou prescrição. Consulte um profissional antes de utilizar qualquer substância.</p></div></section>`;head.hidden=true;window.scrollTo({top:0,behavior:'smooth'})}
    function go(step){if(state.step>=0&&state.step<=questions.length&&!state.history.includes(state.step))state.history.push(state.step);state.step=step;if(step<questions.length)renderQuestion();else renderName();window.scrollTo({top:0,behavior:'smooth'})}
    back.onclick=()=>{if(state.step>0){state.step--;renderQuestion();window.scrollTo({top:0,behavior:'smooth'})}}
    renderIntro();
  </script>
</body>
</html>
